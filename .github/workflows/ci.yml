name: VEYRA CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Run backend tests with coverage
        env:
          PYTHONPATH: .
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Validate tool documentation
        run: PYTHONPATH=backend python scripts/validate_tool_documentation.py

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Verify tool docs are in sync with catalog
        run: PYTHONPATH=backend python scripts/generate_tool_docs.py --check
      - name: Verify checklist docs are in sync with registry
        run: PYTHONPATH=backend python scripts/validate_checklists.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - name: Enforce frontend coverage floor 65%
        run: |
          node -e "
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));
          const pct=j.total.statements.pct;
          console.log('Frontend statements coverage:',pct+'%');
          if(pct<65){console.error('FAIL: frontend coverage '+pct+'% < 65% floor');process.exit(1);}
          "
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30
          if-no-files-found: warn

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate backend SBOM (CycloneDX)
        run: |
          cd backend
          cyclonedx-py environment -o ../backend-sbom.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Generate frontend SBOM (CycloneDX)
        run: |
          cd frontend
          npx @cyclonedx/cyclonedx-npm --output-file ../frontend-sbom.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend-sbom.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: frontend-sbom.json
          retention-days: 90
          if-no-files-found: error

      - name: Summarize SBOMs
        run: |
          echo "## SBOM summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend components: $(grep -c '\"bom-ref\"' backend-sbom.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend components: $(grep -c '\"bom-ref\"' frontend-sbom.json)" >> $GITHUB_STEP_SUMMARY

  vuln-scan:
    runs-on: ubuntu-latest
    needs: sbom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          merge-multiple: true
      - name: Run grype on SBOMs (report only)
        uses: anchore/scan-action@v4
        with:
          sbom: backend-sbom.json
          fail-build: false
          output-format: table

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build worker image
        run: docker build -f worker/v50/Dockerfile -t veyra-worker:v50 .
      - name: Trivy scan (report only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: veyra-worker:v50
          format: table
          exit-code: '0'