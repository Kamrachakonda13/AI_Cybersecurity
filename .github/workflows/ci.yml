name: VEYRA CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - name: Run backend tests with coverage
        env:
          PYTHONPATH: .
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30
          if-no-files-found: warn

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Validate tool documentation
        run: PYTHONPATH=backend python scripts/validate_tool_documentation.py

  docs-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Verify tool docs are in sync with catalog
        run: PYTHONPATH=backend python scripts/generate_tool_docs.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 30
          if-no-files-found: warn

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Generate backend SBOM (CycloneDX)
        run: |
          cd backend
          cyclonedx-py environment -o ../backend-sbom.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Generate frontend SBOM (CycloneDX)
        run: |
          cd frontend
          npx @cyclonedx/cyclonedx-npm --output-file ../frontend-sbom.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: backend-sbom.json
          retention-days: 90
          if-no-files-found: error
      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-frontend
          path: frontend-sbom.json
          retention-days: 90
          if-no-files-found: error

      - name: Summarize SBOMs
        run: |
          echo "## SBOM summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Backend components: $(grep -c '\"bom-ref\"' backend-sbom.json)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend components: $(grep -c '\"bom-ref\"' frontend-sbom.json)" >> $GITHUB_STEP_SUMMARY