name: VEYRA security supply-chain gates

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - name: Run supply-chain test suite
        env:
          PYTHONPATH: backend
        run: |
          pytest -q \
            backend/tests/test_v40_supply_chain.py \
            backend/tests/test_v41_supply_chain_runtime.py \
            backend/tests/test_v42_trusted_supply_chain.py \
            backend/tests/test_v50_control_plane.py \
            backend/tests/test_v50_enterprise_completion.py

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Byte-compile backend and workers
        run: python -m compileall -q backend/app worker/v41 worker/v42 worker/v50