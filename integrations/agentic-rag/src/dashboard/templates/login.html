<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Enterprise Knowledge Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-sm">
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
            <h1 class="text-lg font-semibold text-slate-900">RAG Admin</h1>
            <p class="text-xs text-slate-500 mt-1 mb-5">Sign in to access the dashboard</p>

            {% if error %}
            <div class="mb-4 px-3 py-2 rounded bg-rose-50 border border-rose-200 text-rose-700 text-sm">
                Invalid credentials. Try again.
            </div>
            {% endif %}

            <form method="post" action="/dashboard/login" class="space-y-4">
                <div>
                    <label for="user_id" class="block text-xs font-medium text-slate-600 uppercase tracking-wide mb-1">User ID</label>
                    <input id="user_id" name="user_id" type="text" required autofocus
                           class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-xs font-medium text-slate-600 uppercase tracking-wide mb-1">Password</label>
                    <input id="password" name="password" type="password" required
                           class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit"
                        class="w-full bg-slate-900 text-white py-2 rounded text-sm font-medium hover:bg-slate-800 transition">
                    Sign in
                </button>
            </form>
        </div>

        <p class="text-xs text-slate-400 text-center mt-4">Enterprise Knowledge Assistant · v1.0</p>
    </div>

</body>
</html>
